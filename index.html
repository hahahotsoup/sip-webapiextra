<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sip — 品，你细品 🍲</title>
<style>
:root {
  --bg: #f7f2e9;
  --bg2: #fdfaf4;
  --card: #fffdf8;
  --ink: #3d3226;
  --ink2: #6b5d4c;
  --ink3: #9a8b78;
  --line: #e8dcc8;
  --accent: #c07a3e;
  --accent2: #a05f2c;
  --accent-soft: #f3e3d0;
  --good: #6b8f5e;
  --warn: #c9a13b;
  --bad: #b3543f;
  --like: #d4567a;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(90, 65, 35, .08);
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.7 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font: inherit; cursor: pointer;
  border: 1px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 10px; padding: 6px 14px;
  transition: all .15s;
}
button:hover { border-color: var(--accent); color: var(--accent2); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent2); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
input, select {
  font: inherit; color: var(--ink);
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 12px; outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 顶栏 ---------- */
header {
  background: linear-gradient(135deg, #f6e8d2, #f0d9b8);
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.logo { font-size: 19px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.logo small { font-weight: 400; font-size: 12px; color: var(--ink2); margin-left: 6px; }
.slogan { color: var(--ink3); font-size: 12.5px; white-space: nowrap; }
header .spacer { flex: 1; }
.searchbox { display: flex; gap: 6px; align-items: center; }
.searchbox input { width: 240px; }
#status { font-size: 12.5px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); display: inline-block; }
.dot.ok { background: var(--good); }
.dot.bad { background: var(--bad); }

/* ---------- 布局 ---------- */
#layout { display: flex; flex: 1; min-height: 0; }
aside {
  width: 300px; min-width: 260px; background: var(--bg2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
}
#feedList { flex: 1; overflow-y: auto; padding: 10px; }
main { flex: 1; overflow-y: auto; padding: 20px 26px; }

/* ---------- 侧栏 ---------- */
.navitem {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 11px; border-radius: 10px; cursor: pointer;
  margin-bottom: 2px; border: 1px solid transparent;
}
.navitem:hover { background: var(--bg); }
.navitem.active { background: var(--accent-soft); border-color: #e2c3a0; }
.navitem .ico { font-size: 16px; width: 22px; text-align: center; }
.navitem .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navitem .cnt { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.navitem .health { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.health.ok { background: var(--good); }
.health.warn { background: var(--warn); }
.health.bad { background: var(--bad); }
aside .tools { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; min-width: 0; }
.toolrow { display: flex; gap: 6px; }
.toolrow button { flex: 1; padding: 6px 8px; font-size: 13px; }

/* ---------- 通用块 ---------- */
.pagehead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.pagehead h1 { font-size: 21px; margin: 0; }
.pagehead .sub { color: var(--ink3); font-size: 13px; }
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px; margin-bottom: 14px;
}
.empty { color: var(--ink3); text-align: center; padding: 40px 0; font-size: 14px; }
.muted { color: var(--ink3); font-size: 12.5px; }
.tag {
  display: inline-block; font-size: 11.5px; padding: 1px 8px;
  border-radius: 20px; background: var(--bg); border: 1px solid var(--line);
  color: var(--ink2); margin-left: 6px;
}
.tag.warn { background: #f7ecd2; border-color: #e4cf96; color: #8a6d1f; }
.tag.bad { background: #f6e2dc; border-color: #e2b8ab; color: #96412f; }
.tag.good { background: #e9f0e4; border-color: #c4d6ba; color: #4e7142; }
.tag.like { background: #f9e4ec; border-color: #ecc0d2; color: #a93a63; }
.toastwrap { position: fixed; top: 64px; right: 18px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: #f7f2e9; padding: 9px 16px; border-radius: 10px;
  font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 360px;
  animation: slidein .2s ease;
}
.toast.err { background: var(--bad); }
.toast.good { background: var(--good); }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }

/* ---------- 概览卡片 ---------- */
.statrow { display: flex; gap: 14px; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 150px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 18px; text-align: center;
}
.stat .v { font-size: 26px; font-weight: 700; color: var(--accent2); }
.stat .k { font-size: 12.5px; color: var(--ink3); margin-top: 2px; }

/* ---------- 文章列表 ---------- */
.art {
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); margin-bottom: 8px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.art:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.art .t { font-weight: 600; font-size: 15px; line-height: 1.5; }
.art .m { margin-top: 4px; color: var(--ink3); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.art .snippet { margin-top: 6px; color: var(--ink2); font-size: 13px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
mark { background: #f5d78e; border-radius: 3px; padding: 0 2px; }

/* ---------- 阅读页 ---------- */
.readhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.readhead h1 { margin: 0; font-size: 23px; line-height: 1.45; }
.readmeta { color: var(--ink3); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 14px; }
.readops { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
#articleBody { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 34px; }
#articleBody iframe { width: 100%; border: none; min-height: 60vh; background: #fff; border-radius: 8px; }
.fulltext { white-space: pre-wrap; font-size: 15.5px; line-height: 1.9; }

/* ---------- diff ---------- */
.diffwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.diffcol { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.diffcol h4 { margin: 0; padding: 8px 14px; font-size: 13px; background: var(--bg); border-bottom: 1px solid var(--line); }
.diffbody { max-height: 55vh; overflow-y: auto; font-family: var(--mono); font-size: 12.5px; }
.dline { padding: 3px 14px; white-space: pre-wrap; word-break: break-all; }
.dline.add { background: #e8f2e2; color: #3f6b33; }
.dline.del { background: #f8e5e0; color: #98402c; }
.dline.unch { color: var(--ink3); }
.dline.num { color: var(--ink3); user-select: none; }

/* ---------- 搜索 ---------- */
.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tabs button { border-radius: 20px; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.resmeta { color: var(--ink3); font-size: 13px; margin-bottom: 10px; }
.hit { padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  margin-bottom: 8px; cursor: pointer; }
.hit:hover { border-color: var(--accent); }
.hit .t { font-weight: 600; }
.hit .snips { margin-top: 5px; font-size: 13px; color: var(--ink2); }
.hit .snips div { margin-top: 2px; }

/* ---------- 版本 ---------- */
.ver { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: 6px; background: var(--card); font-size: 13.5px; cursor: pointer; }
.ver:hover { border-color: var(--accent); }
.ver .vid { font-family: var(--mono); color: var(--accent2); font-weight: 600; min-width: 42px; }
.ver .cur { color: var(--good); }
.ver select, .ver button { margin-left: auto; }

/* ---------- 今日哈汤 ---------- */
.today-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 10px; cursor: pointer; }
.today-item:hover { border-color: var(--accent); }
.today-item .no { font-size: 20px; font-weight: 700; color: var(--accent); width: 34px; text-align: center; }
.today-item .tt { font-weight: 600; }

/* ---------- 证据库（ingest） ---------- */
.ev { border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  padding: 12px 14px; margin-bottom: 8px; }
.ev .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ev .ex { margin-top: 6px; color: var(--ink2); font-size: 13.5px; white-space: pre-wrap;
  max-height: 120px; overflow-y: auto; }
.ev .ops { margin-top: 8px; display: flex; gap: 6px; }
.ev .ops button { padding: 3px 10px; font-size: 12.5px; }
.evfull { white-space: pre-wrap; font-size: 14px; line-height: 1.8; background: var(--bg2);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 8px; }
.addcard { display: flex; flex-direction: column; gap: 8px; }
.addcard textarea { font: inherit; color: var(--ink); background: var(--bg2);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; outline: none;
  resize: vertical; min-height: 70px; }
.addcard textarea:focus { border-color: var(--accent); }
.addrow2 { display: flex; gap: 6px; flex-wrap: wrap; }
.addrow2 input { flex: 1; min-width: 140px; }
.askbox { display: flex; gap: 6px; }
.askbox input { flex: 1; }
.qa { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-top: 10px; font-size: 14px; }
.qa .q { color: var(--accent2); font-weight: 600; margin-bottom: 6px; }
.qa .a { white-space: pre-wrap; line-height: 1.8; }
.cluster { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 8px; background: var(--card); }
.cluster .rep { font-weight: 600; }
.today-item .rs { margin-top: 4px; color: var(--ink2); font-size: 13px; }
.today-item .mm { margin-top: 6px; color: var(--ink3); font-size: 12.5px; display: flex; gap: 12px; }
.soup { font-size: 40px; text-align: center; padding: 26px 0 10px; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #d9c9b0; border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }
@media (max-width: 820px) {
  aside { width: 220px; min-width: 180px; }
  #articleBody { padding: 16px; }
  .diffwrap { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🍲 sip <small>品，你细品。</small></div>
  <span class="slogan">专治信息过载 · 本地优先</span>
  <div class="spacer"></div>
  <div class="searchbox">
    <input id="searchInput" placeholder="全文搜索…（回车）" />
    <button id="searchBtn">搜索</button>
  </div>
  <button id="todayBtn" title="今日哈汤">🍵 今日哈汤</button>
  <span id="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></span>
</header>

<div id="layout">
  <aside>
    <div id="feedList"></div>
    <div class="tools">
      <div class="addrow">
        <input id="addUrl" placeholder="添加订阅源（RSS URL）" />
        <button id="addBtn" title="添加">＋</button>
      </div>
      <div class="toolrow">
        <button id="syncBtn" title="只更新到期的源">🔄 同步</button>
        <button id="updateAllBtn" title="强制更新所有源">⚡ 全更</button>
        <button id="likesBtn" title="收藏列表">♥</button>
      </div>
      <div class="toolrow">
        <button id="evBtn" title="证据库（ingest）">🗃 证据库</button>
        <button id="simonBtn" title="孟思琳安全守护状态">🔒 孟思琳</button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div class="toastwrap" id="toasts"></div>

<script>
"use strict";
/* =====================================================================
 * sip-web 前端 —— 所有数据来自后端翻译层（sip-web.py），
 * 后端把请求翻译成 sip CLI --json 调用。
 * =================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const fmtTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const num = n => n == null ? "0" : Number(n).toLocaleString();

let state = { view: "feeds", feedId: null, articleId: null };

/* ---------- toast ---------- */
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  let data;
  try { data = await res.json(); }
  catch { throw new Error("服务器返回了无法解析的内容（HTTP " + res.status + "）"); }
  if (!data || data.success === false) {
    const e = (data && data.error) || {};
    throw new Error(e.message || e.details || ("请求失败（HTTP " + res.status + "）"));
  }
  return data;
}
const getJSON = p => api(p);
const postJSON = (p, body) => api(p, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

/* ---------- 状态指示 ---------- */
async function refreshStatus() {
  try {
    const d = await api("/api/status");
    const dot = $("#dot"), txt = $("#statusText");
    dot.className = "dot ok";
    txt.textContent = "sip " + (d.data.sip || "?");
  } catch (e) {
    $("#dot").className = "dot bad";
    $("#statusText").textContent = "离线";
  }
}

/* ---------- 订阅源侧栏 ---------- */
async function loadFeeds(keepSelection = false) {
  try {
    const d = await getJSON("/api/feeds");
    const feeds = (d.data && d.data.feeds) || [];
    const sel = keepSelection ? state.feedId : null;
    renderFeedList(feeds);
    if (state.view === "feeds") renderOverview(feeds);
    if (state.view === "feed" && sel) { state.feedId = sel; openFeed(sel); }
  } catch (e) {
    $("#feedList").innerHTML = `<div class="empty">${esc(e.message)}<br><br>
      <button onclick="location.reload()">重试</button></div>`;
  }
}

function renderFeedList(feeds) {
  const el = $("#feedList");
  if (!feeds.length) {
    el.innerHTML = `<div class="empty">还没有订阅源<br>在下方输入 RSS 地址添加第一个吧 🍲</div>`;
    return;
  }
  const total = feeds.reduce((s, f) => s + (f.active || 0), 0);
  el.innerHTML =
    `<div class="navitem ${state.view === "feeds" ? "active" : ""}" data-nav="feeds">
       <span class="ico">🏠</span><span class="name">全部订阅</span><span class="cnt">${num(total)} 篇</span>
     </div>` +
    feeds.map(f => {
      const health = (f.health === "ok") ? "ok" : (f.failCount > 0 ? "bad" : "warn");
      const active = state.view === "feed" && String(state.feedId) === String(f.id);
      return `<div class="navitem ${active ? "active" : ""}" data-feed="${f.id}">
        <span class="ico">📡</span>
        <span class="name" title="${esc(f.title)}">${esc(f.title)}</span>
        <span class="cnt">${num(f.active)}</span>
        <span class="health ${health}" title="health: ${esc(f.health)}"></span>
      </div>`;
    }).join("");
  el.querySelectorAll("[data-feed]").forEach(n => n.onclick = () => {
    state.view = "feed"; state.feedId = n.dataset.feed;
    openFeed(n.dataset.feed); markNav();
  });
  el.querySelector("[data-nav='feeds']").onclick = () => { state.view = "feeds"; loadFeeds(); markNav(); };
}
function markNav() {
  document.querySelectorAll("#feedList .navitem").forEach(n => {
    const on = n.dataset.feed
      ? (state.view === "feed" && n.dataset.feed === String(state.feedId))
      : (state.view === "feeds");
    n.classList.toggle("active", on);
  });
}

/* ---------- 概览 ---------- */
function renderOverview(feeds) {
  const total = feeds.reduce((s, f) => s + (f.active || 0), 0);
  const archived = feeds.reduce((s, f) => s + (f.archived || 0), 0);
  const bad = feeds.filter(f => f.health !== "ok" || f.failCount > 0).length;
  const main = $("#main");
  main.innerHTML = `
    <div class="pagehead"><h1>今日汤底</h1><span class="sub">🍲 品，你细品 —— 慢慢来，不着急</span></div>
    <div class="statrow">
      <div class="stat"><div class="v">${num(feeds.length)}</div><div class="k">订阅源</div></div>
      <div class="stat"><div class="v">${num(total)}</div><div class="k">未读文章</div></div>
      <div class="stat"><div class="v">${num(archived)}</div><div class="k">已归档</div></div>
      <div class="stat"><div class="v" style="color:${bad ? "var(--bad)" : "var(--good)"}">${bad}</div><div class="k">健康告警</div></div>
    </div>
    <div style="height:16px"></div>
    <div class="pagehead"><h1>🍵 今日哈汤</h1>
      <button id="ovToday" class="primary">来一碗</button></div>
    <div class="card" id="todayCard"><div class="empty">加载中…</div></div>`;
  $("#ovToday").onclick = () => { state.view = "today"; loadToday(false); };
  getJSON("/api/today").then(d => {
    const dd = d.data || {};
    const items = dd.items || [];
    const card = $("#todayCard");
    if (!items.length) {
      card.innerHTML = `<div class="empty">今天还没有哈汤 —— 点「来一碗」生成今日清单</div>`;
      return;
    }
    card.innerHTML = `<div style="margin-bottom:10px;color:var(--ink2);font-size:13.5px">
      今日哈汤 · ${esc(dd.date || "")} · 生成于 ${esc(dd.generatedAt || "")}
      ${dd.refreshed ? '<span class="tag good">已刷新</span>' : ""}
    </div>` +
    items.map((it, i) => `<div class="today-item" data-id="${it.itemId}">
      <div class="no">${i + 1}</div>
      <div style="flex:1"><div class="tt">${esc(it.title)}</div>
        <div class="rs">${esc(it.reason || "")}</div>
        <div class="mm"><span>📡 ${esc(it.source || "")}</span>
          <span>⏱ ~${it.minutes ?? 0} 分钟</span>
          ${it.score ? `<span>评分 ${it.score}</span>` : ""}</div>
      </div></div>`).join("");
    card.querySelectorAll(".today-item").forEach(x => x.onclick = () => {
      state.view = "article"; state.articleId = x.dataset.id; openArticle(x.dataset.id);
    });
  }).catch(() => { $("#todayCard").innerHTML = `<div class="empty">今日哈汤加载失败</div>`; });
}

/* ---------- 订阅源文章列表 ---------- */
async function openFeed(fid) {
  const main = $("#main");
  main.innerHTML = `<div class="empty">加载中…</div>`;
  try {
    const d = await getJSON("/api/feeds/" + fid);
    const dd = d.data || {};
    const arts = dd.articles || [];
    main.innerHTML = `
      <div class="pagehead">
        <h1>📡 ${esc(dd.feedTitle || "")}</h1>
        <span class="sub">${num(arts.length)} 篇文章</span>
        <span style="flex:1"></span>
        <button id="fInfo">ℹ 源信息</button>
        <button id="fUpdate">🔄 更新</button>
        <button id="fArchive">🗄 ${dd.archived ? "取消归档" : "归档"}</button>
        <button id="fDelete" class="danger">🗑 删除</button>
      </div>
      <div id="infoPane"></div>
      <div id="artList"></div>`;

/* ---------- 文章阅读 ---------- */
async function openArticle(aid) {
  if (state.view !== "article") state.from = state.view;
  state.view = "article";
  const main = $("#main");
  main.innerHTML = `<div class="empty">加载中…</div>`;
  try {
    const d = await getJSON("/api/articles/" + aid);
    const a = d.data || {};
    const body = a.fulltext || a.content || "";
    main.innerHTML = `
      <div class="pagehead">
        <button id="backBtn">← 返回</button>
        <div style="flex:1"></div>
        <span id="likeBtn2" class="tag like" style="cursor:pointer;display:${a.liked ? "inline-block" : "none"}">♥ 已收藏</span>
      </div>
      <div class="readhead">
        <h1>${esc(a.title || "")}</h1>
      </div>
      <div class="readmeta">
        <span>📡 ${esc(a.feed || "")}</span>
        ${a.published ? `<span>🕒 ${fmtTime(a.published)}</span>` : ""}
        ${a.author ? `<span>✍ ${esc(a.author)}</span>` : ""}
        ${a.link ? `<span><a href="${esc(a.link)}" target="_blank" rel="noopener">🔗 原文 ↗</a></span>` : ""}
      </div>
      <div class="readops">
        <button id="likeBtn">${a.liked ? "♥ 取消收藏" : "♥ 收藏"}</button>
        <button id="fullBtn">📥 抓全文</button>
        <button id="verBtn">📜 版本</button>
        <button id="diffBtn">⇄ 对比改动</button>
        <button id="sumBtn">✨ 生成摘要</button>
      </div>
      <div id="articleBody">${renderBody(body, a)}</div>
      <div id="subPane" style="margin-top:16px"></div>`;
    $("#backBtn").onclick = () => {
      const from = state.from || "feeds";
      if (from === "feed" && state.feedId) { state.view = "feed"; openFeed(state.feedId); }
      else if (from === "today") { state.view = "today"; loadToday(false); }
      else if (from === "likes") { state.view = "likes"; loadLikes(); }
      else if (from === "search" && state.lastQuery) { state.view = "search"; openSearch(state.lastQuery); }
      else { state.view = "feeds"; loadFeeds(); }
    };
    $("#likeBtn").onclick = async () => {
      await act(() => postJSON(`/api/articles/${aid}/like`), a.liked ? "已取消收藏" : "已收藏 ♥");
      openArticle(aid);
    };
    $("#fullBtn").onclick = async () => {
      try {
        toast("正在抓取全文…");
        const r = await postJSON(`/api/articles/${aid}/fulltext`);
        const dd = r.data || {};
        toast(dd.fulltext ? "全文已抓取 ✓" : (dd.message || "完成"), "good");
        openArticle(aid);
      } catch (e) { toast(e.message, "err"); }
    };
    $("#verBtn").onclick = () => loadVersions(aid);
    $("#diffBtn").onclick = () => loadDiff(aid);
    $("#sumBtn").onclick = async () => {
      try {
        toast("生成中…");
        const r = await postJSON(`/api/articles/${aid}/summary`);
        const dd = r.data || {};
        if (dd.summary) toast("摘要：" + String(dd.summary).slice(0, 200), "good");
        else toast(JSON.stringify(dd).slice(0, 200), "good");
      } catch (e) { toast(e.message, "err"); }
    };
  } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function renderBody(body, a) {
  if (!body) return `<div class="empty">这篇文章没有正文内容</div>`;
  if (a.fulltext) return `<div class="fulltext">${esc(body)}</div>`;
  // content 是原始 HTML：放进 iframe 隔离渲染，base 指向原文以修复相对路径
  const base = a.link ? `<base href="${esc(a.link)}">` : "";
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8">${base}
    <style>body{font:15.5px/1.9 "PingFang SC","Microsoft YaHei",sans-serif;color:#3d3226;
    max-width:760px;margin:0 auto;padding:8px 4px}img{max-width:100%;height:auto}
    pre{overflow-x:auto;background:#f7f2e9;padding:12px;border-radius:8px}
    blockquote{border-left:3px solid #c07a3e;margin-left:0;padding-left:14px;color:#6b5d4c}
    a{color:#a05f2c}h1,h2,h3{line-height:1.4}</style></head><body>${body}</body></html>`;
  return `<iframe sandbox="allow-same-origin" srcdoc="${esc(html)}"></iframe>`;
}

/* ---------- 版本历史 ---------- */
async function loadVersions(aid) {
  const pane = $("#subPane");

    if (!list.length) { pane.innerHTML = `<div class="empty">没有历史版本（或该文章只有一版）</div>`; return; }
    pane.innerHTML = `<div class="pagehead"><h1>📜 版本历史</h1><span class="sub">点击版本查看原文</span></div>` +
      list.map(v => `<div class="ver" data-id="${v.itemId ?? v.id ?? v.versionId ?? ""}">
        <span class="vid">v${v.version ?? v.v ?? v.id ?? "?"}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.title || "")}</span>
        <span class="muted">${fmtTime(v.published || v.time || v.updated || v.archivedAt)}</span>
        ${v.isCurrent || v.current ? '<span class="cur">← 当前</span>' : ""}

/* ---------- diff 对比 ---------- */
async function loadDiff(aid) {
  const pane = $("#subPane");
  pane.innerHTML = `<div class="empty">对比中…</div>`;
  try {
    const r = await getJSON(`/api/articles/${aid}/diff`);
    const dd = r.data || r;   // sip 的 diff JSON 把 changes 放在根层，没有 data 包装
    const changes = dd.changes || [];
    if (!changes.length) { pane.innerHTML = `<div class="empty">没有可对比的改动（或只有一版）</div>`; return; }
    let add = 0, del = 0;
    changes.forEach(c => { if (c.type === "insert" || c.type === "replace") add++; if (c.type === "delete" || c.type === "replace") del++; });
    pane.innerHTML = `<div class="pagehead"><h1>⇄ 改动对比</h1>
      <span class="sub"><span style="color:var(--good)">+${add} 行</span> · <span style="color:var(--bad)">-${del} 行</span>
      ${dd.from ? ` · ${esc(dd.from)} → ${esc(dd.to)}` : ""}</span></div>
      <div class="diffwrap"><div class="diffcol"><h4>旧版</h4><div class="diffbody">${diffCol(changes, "old")}</div></div>
      <div class="diffcol"><h4>新版</h4><div class="diffbody">${diffCol(changes, "new")}</div></div></div>`;
  } catch (e) { pane.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function diffCol(changes, side) {
  let i = 0;
  const rows = [];
  changes.forEach(c => {
    i++;
    if (side === "old") {
      if (c.type === "insert") return;
      rows.push(`<div class="dline ${c.type === "unchanged" ? "unch" : "del"}"><span class="num">${i}</span> ${esc(c.before || " ")}</div>`);
    } else {
      if (c.type === "delete") return;
      rows.push(`<div class="dline ${c.type === "unchanged" ? "unch" : "add"}"><span class="num">${i}</span> ${esc(c.after || " ")}</div>`);
    }
  });
  return rows.join("");
}

/* ---------- 搜索 ---------- */
function openSearch(kw) {
  state.view = "search";
  state.lastQuery = kw;
  const main = $("#main");
  main.innerHTML = `
    <div class="pagehead"><h1>🔍 搜索</h1><span class="sub">“${esc(kw)}”</span></div>
    <div class="tabs">
      <button id="tabGrep" class="active">📄 全文搜索（不依赖 AI）</button>
      <button id="tabSem">🧠 语义搜索（需 AI）</button>
    </div>
    <div id="searchRes"><div class="empty">搜索中…</div></div>`;
  $("#tabGrep").onclick = () => { $("#tabGrep").classList.add("active"); $("#tabSem").classList.remove("active"); runSearch(kw, "grep"); };
  $("#tabSem").onclick = () => { $("#tabSem").classList.add("active"); $("#tabGrep").classList.remove("active"); runSearch(kw, "semantic"); };
  runSearch(kw, "grep");
}

async function runSearch(kw, kind) {
  const box = $("#searchRes");
  box.innerHTML = `<div class="empty">搜索中…</div>`;
  const path = kind === "grep" ? "/api/search/grep" : "/api/search/semantic";
  try {
    const r = await getJSON(path + "?q=" + encodeURIComponent(kw));
    const dd = r.data || {};
    const hits = dd.results || dd.hits || dd.matches || [];
    const isArr = Array.isArray(hits);
    const items = isArr ? hits : [];
    if (!items.length) {
      box.innerHTML = `<div class="empty">没有命中“${esc(kw)}”。${kind === "semantic" ? "试试降低阈值，或改用全文搜索。" : "换个关键词？"}</div>`;
      return;
    }
    box.innerHTML = `<div class="resmeta">共 ${num(items.length)} 条结果${dd.thresholdUsed ? ` · 阈值 ${dd.thresholdUsed}` : ""}</div>` +
      items.map(h => {
        const id = h.itemId ?? h.id;
        const title = h.title || h.headline || "";
        const feed = h.feed || h.feedTitle || "";
        const score = h.score != null ? ` · 相似度 ${Number(h.score).toFixed(2)}` : (h.count != null ? ` · 命中 ${h.count} 次` : "");
        const snips = (h.snippets && h.snippets.length) ? h.snippets
          : (h.snippet ? [h.snippet] : (h.before ? [{ text: (h.before || "") + "…" + (h.after || "") }] : []));
        return `<div class="hit" data-id="${id}">
          <div class="t">${esc(title)} <span class="muted">#${id} · ${esc(feed)}${score}</span></div>
          ${snips.length ? `<div class="snips">${snips.map(s => `<div>…${esc(s.text ?? s)}…</div>`).join("")}</div>` : ""}
        </div>`;
      }).join("");
    box.querySelectorAll(".hit").forEach(x => x.onclick = () => {
      state.view = "article"; state.articleId = x.dataset.id; openArticle(x.dataset.id);
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}
      <br><br><button onclick="runSearch('${esc(kw)}','${kind}')">重试</button></div>`;
  }
}

/* ---------- 今日哈汤 ---------- */
async function loadToday(refresh) {
  state.view = "today";
  const main = $("#main");
  main.innerHTML = `<div class="empty">加载中…</div>`;
  try {
    const r = await getJSON("/api/today" + (refresh ? "?refresh=1" : ""));
    const dd = r.data || {};
    const items = dd.items || [];
    const digest = dd.digest || {};
    main.innerHTML = `
      <div class="pagehead"><h1>🍵 今日哈汤</h1>
        <span class="sub">${esc(dd.date || "")} · 生成于 ${esc(dd.generatedAt || "")}
        ${dd.refreshed ? " · 已重新来一碗" : ""}</span>
        <span style="flex:1"></span>
        <button id="refreshToday" class="primary">♨ 重新来一碗</button>
      </div>`;
    $("#refreshToday").onclick = () => loadToday(true);
    let html = "";
    if (digest.newTotal > 0 || digest.modified?.length || digest.dedups?.length) {
      html += `<div class="card"><b>📊 今日变化摘要</b><div style="margin-top:8px;color:var(--ink2);font-size:13.5px">`;
      if (digest.newTotal > 0) html += `<div>🆕 新增 ${num(digest.newTotal)} 篇（${num(digest.sourceCount || 0)} 个源）</div>`;
      (digest.modified || []).forEach(m => {
        html += `<div>✎ 作者改过：<b>${esc(m.title || "")}</b>${m.changes ? `（${esc(m.changes)}）` : ""}${m.itemId ? ` <a data-goto="${m.itemId}" style="cursor:pointer">→ 看改动</a>` : ""}</div>`;
      });
      (digest.dedups || []).forEach(x => {
        html += `<div>⚠ 可能同文：${esc(x.titleA || x.title || "")} / ${esc(x.titleB || "")}</div>`;
      });
      html += `</div></div>`;
    }
    if (!items.length) {
      html += `<div class="soup">🍵</div><div class="empty">今天这碗汤还没熬 —— 点「重新来一碗」生成今日清单</div>`;
    } else {
      html += items.map((it, i) => `<div class="today-item" data-id="${it.itemId}">
        <div class="no">${i + 1}</div>
        <div style="flex:1"><div class="tt">${esc(it.title)}</div>
          <div class="rs">${esc(it.reason || "")}</div>
          <div class="mm"><span>📡 ${esc(it.source || "")}</span>
            <span>⏱ ~${it.minutes ?? 0} 分钟</span></div>
        </div></div>`).join("");
      html += `<div class="muted" style="text-align:center;margin-top:14px">每天一小碗，读完就关 🍲</div>`;
    }
    main.insertAdjacentHTML("beforeend", html);
    main.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => {
      state.view = "article"; state.articleId = a.dataset.goto; openArticle(a.dataset.goto);
    });
    main.querySelectorAll(".today-item").forEach(x => x.onclick = () => {
      state.view = "article"; state.articleId = x.dataset.id; openArticle(x.dataset.id);
    });
  } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

        <div class="ops">
          <button class="evShow">查看全文</button>
          <button class="evRefresh">♻ 刷新</button>
          <button class="evConfirm">✓ 核实</button>
          <button class="evRm danger">🗑 删除</button>
        </div>
      </div>`;
    }).join("");
  box.querySelectorAll(".ev").forEach(row => {
    const id = row.dataset.id;
    row.querySelector(".evShow").onclick = async () => {
      const full = row.querySelector(".evfull");
      if (full.style.display === "none") {
        full.style.display = "block";
        full.textContent = "加载中…";
        try {
          const r = await getJSON(`/api/ingest/${id}`);
          const dd = r.data || {};
          full.textContent = dd.content || dd.excerpt || "(无内容)";
          row.querySelector(".evShow").textContent = "收起";
        } catch (e) { full.textContent = e.message; }
      } else {
        full.style.display = "none";
        row.querySelector(".evShow").textContent = "查看全文";
      }
    };
    row.querySelector(".evRefresh").onclick = async () => {
      await act(() => postJSON(`/api/ingest/${id}/refresh`), `#${id} 已刷新`);
      loadIngest();
    };
    row.querySelector(".evConfirm").onclick = async () => {
      await act(() => postJSON(`/api/ingest/${id}/confirm`), `#${id} 已核实 ✓`);
      loadIngest();
    };
    row.querySelector(".evRm").onclick = async () => {
      if (!confirm(`删除证据 #${id}？`)) return;
      await act(() => api(`/api/ingest/${id}`, { method: "DELETE" }), "已删除");
      loadIngest();
    };
  });
}

async function runEvRetrieve() {
  const q = $("#evRetrieveQ").value.trim();
  const box = $("#evRetrieveRes");
  if (!q) { toast("请输入检索词", "err"); return; }
  box.innerHTML = `<div class="empty">检索中…</div>`;
  try {
    const r = await getJSON("/api/ingest/retrieve?q=" + encodeURIComponent(q));
    const dd = r.data || {};
    const hits = dd.hits || [];
    if (!hits.length) { box.innerHTML = `<div class="empty">没有命中“${esc(q)}”</div>`; return; }
    box.innerHTML = `<div class="resmeta">命中 ${num(hits.length)} 条（查询：${esc(dd.query || q)}）</div>` +
      hits.map(h => {
        const id = h.id;
        const snip = h.snippet || h.excerpt || h.content || "";
        return `<div class="hit" data-id="${id}">
          <div class="t">#${id} · ${esc(h.title || h.source || "")}
            ${h.hasDiff ? '<span class="tag warn">✎ 被改过</span>' : ""}
            ${h.reversed ? '<span class="tag bad">🔴 反转</span>' : ""}
            ${h.grade ? `<span class="tag">${esc(h.grade)}</span>` : ""}
            <span class="muted">${h.sourceUrl ? ` · ${esc(h.sourceUrl)}` : ""}</span>
          </div>
          <div class="snips"><div>…${esc(snip)}…</div></div>
        </div>`;
      }).join("");
    box.querySelectorAll(".hit").forEach(x => x.onclick = () => loadEvDetail(x.dataset.id));
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function loadEvDetail(id) {
  // 展开证据详情（在检索结果下追加）
  const box = $("#evRetrieveRes");
  try {
    const r = await getJSON(`/api/ingest/${id}`);
    const dd = r.data || {};
    const old = document.getElementById("evDetail");
    if (old) old.remove();
    const div = document.createElement("div");
    div.id = "evDetail";
    div.className = "qa";
    div.innerHTML = `<div class="q">📄 证据 #${id}（${esc(dd.source || "")}）</div>
      <div class="a">${esc(dd.content || dd.excerpt || "(无内容)")}</div>`;
    box.appendChild(div);
  } catch (e) { toast(e.message, "err"); }
}

async function runEvAsk() {
  const q = $("#evAskQ").value.trim();
  const box = $("#evAskRes");
  if (!q) { toast("请输入问题", "err"); return; }
  box.innerHTML = `<div class="empty">思考中…（只从你的证据里摘录，需要 AI 配置）</div>`;
  try {
    const r = await postJSON("/api/ingest/ask", { question: q });
    const dd = r.data || {};
    const answer = dd.answer || dd.text || JSON.stringify(dd);
    box.innerHTML = `<div class="qa"><div class="q">💬 ${esc(q)}</div><div class="a">${esc(answer)}</div></div>`;
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 孟思琳(simon) 状态 ---------- */
async function loadSimon() {
  const main = $("#main");
  main.innerHTML = `<div class="empty">加载中…</div>`;
  try {
    const r = await getJSON("/api/simon");
    const dd = r.data || {};
    const levelName = { 1: "1 · 常规（守护开启）", 2: "2 · 严格（CLI 写操作全拒）", 3: "3 · 最高（禁写 + 数据加密）" }[dd.level] || dd.level;
    main.innerHTML = `
      <div class="pagehead"><h1>🔒 孟思琳(simon)</h1>
        <span class="sub">永远在岗的安全守护 · 默认开启 · 无法关闭</span></div>
      <div class="statrow">
        <div class="stat"><div class="v">${esc(String(dd.level))}</div><div class="k">挡位</div></div>
        <div class="stat"><div class="v">${esc(dd.encryption || "off")}</div><div class="k">数据加密</div></div>
        <div class="stat"><div class="v">${num(dd.repairs)}</div><div class="k">自动修复</div></div>
        <div class="stat"><div class="v">${num(dd.blocked)}</div><div class="k">拦截次数</div></div>
      </div>
      <div style="height:14px"></div>
      <div class="card">
        <b>当前挡位：${esc(levelName)}</b>
        <div style="margin-top:8px;color:var(--ink2);font-size:13.5px;line-height:1.9">
          <div>· 挡位 1：常规守护（默认）—— 数据库完整性检查、SSRF/终端注入防护、非交互调用管控</div>
          <div>· 挡位 2：严格 —— CLI 写操作一律拒绝（增删改源/归档/抓全文/去重隐藏等），只读命令可用</div>
          <div>· 挡位 3：最高 —— 禁止一切写操作 + 全部数据加密（SQLCipher + AES），密钥存系统凭据库</div>
          <div class="muted" style="margin-top:6px">⚠ 调挡位只能在 TUI 命令栏进行（CLI 降挡会被拒，AI 不代跑）</div>
        </div>
      </div>
      ${(dd.recent || []).length ? `<div class="card"><b>最近事件</b><div style="margin-top:8px">${
        dd.recent.map(x => `<div class="muted">${esc(String(x))}</div>`).join("")}</div></div>` : ""}`;
  } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 通用动作 ---------- */
async function act(fn, okMsg) {
  try { await fn(); toast(okMsg, "good"); }
  catch (e) { toast(e.message, "err"); }
}

/* ---------- 事件绑定 ---------- */
$("#searchBtn").onclick = () => { const v = $("#searchInput").value.trim(); if (v) openSearch(v); };
$("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#searchBtn").click(); });
$("#todayBtn").onclick = () => loadToday(false);
$("#addBtn").onclick = async () => {
  const url = $("#addUrl").value.trim();
  if (!url) { toast("请输入 RSS 地址", "err"); return; }
  await act(() => postJSON("/api/feeds", { url }), "订阅已添加 ✓");
  $("#addUrl").value = "";
  loadFeeds(true);
};
$("#addUrl").addEventListener("keydown", e => { if (e.key === "Enter") $("#addBtn").click(); });
$("#syncBtn").onclick = async () => {
  toast("同步中…");
  await act(() => postJSON("/api/feeds/sync"), "同步完成");
  loadFeeds(true);
};
$("#updateAllBtn").onclick = async () => {
  if (!confirm("强制更新所有订阅源？")) return;
  toast("更新中…");
  await act(() => postJSON("/api/feeds/update-all"), "更新完成");
  loadFeeds(true);
};
$("#likesBtn").onclick = () => loadLikes();
$("#evBtn").onclick = () => loadIngest();
$("#simonBtn").onclick = () => loadSimon();

/* ---------- 启动 ---------- */
refreshStatus();
loadFeeds();
setInterval(refreshStatus, 30000);
</script>
